name: jergadle
description: "Jergadle - Wordle peruano. Adivina las jergas del Perú de 5 letras."
publish_to: 'none'

# version: major.minor.patch+build (SemVer, ver CHANGELOG.md)
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons (estilo iOS) - se mantiene para el widget adaptativo.
  cupertino_icons: ^1.0.8

  # Gestión de estado declarativa (ChangeNotifier + ListenableBuilder).
  provider: ^6.1.2

  # Persistencia local en dispositivo (no hay backend).
  shared_preferences: ^2.3.3
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
